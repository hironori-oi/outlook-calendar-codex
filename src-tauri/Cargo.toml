[package]
name = "nagi-calendar"
version = "0.1.0"
description = "NAGI Calendar desktop application"
authors = ["NAGI Calendar Team"]
edition = "2021"

[lib]
name = "nagi_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
